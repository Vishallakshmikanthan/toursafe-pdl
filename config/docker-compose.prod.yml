version: '3.9'

services:
  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  dashboard-server:
    build:
      context: ../dashboard/server
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
    deploy:
      replicas: 2

  dashboard-client:
    build:
      context: ../dashboard/client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - dashboard-server
